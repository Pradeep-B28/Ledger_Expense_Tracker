<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#131b2e" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Brand Icon Box -->
  <rect x="120" y="140" width="80" height="80" rx="16" fill="url(#blueGrad)" />
  <!-- Credit Card Icon Path -->
  <rect x="136" y="160" width="48" height="34" rx="6" fill="none" stroke="#ffffff" stroke-width="3.5" />
  <line x1="136" y1="172" x2="184" y2="172" stroke="#ffffff" stroke-width="3" />
  <circle cx="148" cy="184" r="3" fill="#ffffff" />

  <!-- Brand Typography -->
  <text x="225" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" fill="#f8fafc" letter-spacing="1">Ledger</text>
  <text x="225" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">Technologies</text>

  <!-- Tagline / Title -->
  <text x="120" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" fill="#ffffff">
    Personal Expense Tracker
  </text>
  <text x="120" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" fill="#60a5fa">
    &amp; Budget Limit Manager
  </text>

  <!-- Value Propositions -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
    <text x="120" y="470">Direct Offline-First Caching</text>
    <text x="430" y="470">•</text>
    <text x="460" y="470">DPDP Act 2023 Compliant</text>
    <text x="770" y="470">•</text>
    <text x="800" y="470">Zero Third-Party Ad Trackers</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="120" y="520" width="960" height="1" fill="#ffffff" fill-opacity="0.1" />
  <text x="120" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#64748b">
    © 2026 Ledger Technologies | Indiranagar, Bangalore, India
  </text>
</svg>
