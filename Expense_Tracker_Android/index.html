<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Ledger - Modern market-ready Expense Tracker, Budget Limit Manager, and Savings Goal Planner." />
    <link rel="manifest" href="/manifest.json" />
    <title>Ledger — Expense Tracker & Budget Manager</title>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        console.log("CRASH_REPORT: " + msg + " at " + url + ":" + line);
        var div = document.createElement('div');
        div.style.color = 'red';
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.background = 'white';
        div.style.zIndex = '9999';
        div.innerText = "CRASH: " + msg + " (" + url + ":" + line + ")";
        document.body.appendChild(div);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
